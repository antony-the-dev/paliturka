<!doctype html>

<head>

<meta name="robots" content="noindex">
<meta name="theme-color" content="#161B52">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/paliturka/pages.css">

<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/paliturka/"><svg width="26" height="30" viewBox="0 0 30 34" aria-hidden="true"><rect x="3" y="2" width="24" height="30" rx="2.5" fill="var(--buy)"/><rect x="3" y="2" width="5" height="30" rx="2" fill="var(--ink)" opacity=".35"/><path d="M19 2h5v14l-2.5-2.2L19 16z" fill="var(--foil)"/></svg>Палітурка</a>
  <a class="back" href="/paliturka/#catalog">До каталогу</a>
</div></header>
<main class="wrap"><section class="doc" style="text-align:center;display:grid;justify-items:center;gap:10px">
<svg width="200" height="120" viewBox="0 0 200 120" role="img" aria-label="Відкрита книжка з порожніми сторінками"><path d="M100 22c-22-12-50-14-80-10v86c30-4 58-2 80 10 22-12 50-14 80-10V12c-30-4-58-2-80 10z" fill="var(--surface)" stroke="var(--line)" stroke-width="3" stroke-linejoin="round"/><path d="M100 22v86" stroke="var(--line)" stroke-width="3"/><path d="M128 50h28M128 62h20M44 50h28M44 62h20" stroke="var(--sunk)" stroke-width="6" stroke-linecap="round"/><text x="100" y="15" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="700" font-size="14" fill="var(--ink-2)">404</text></svg>
<h1>Такої сторінки немає</h1>
<p style="color:var(--ink-2);font-family:var(--f-ui);margin:0">Можливо, посилання застаріло. Спробуйте знайти книжку:</p>
<form action="/paliturka/" method="get" style="display:flex;gap:8px;width:min(100%,460px);margin-top:8px">
  <label for="q" style="position:absolute;left:-9999px">Пошук книжок</label>
  <input id="q" name="q" type="search" placeholder="Назва або автор" required style="flex:1;min-height:48px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font:inherit;color:inherit">

<a class="back" href="/paliturka/" style="margin-top:12px">На головну</a>
</section></main>
<footer><div class="wrap"><span>Палітурка, Ніжин</span><a href="/paliturka/offer.html">Публічна оферта</a><a href="/paliturka/privacy.html">Конфіденційність</a></div></footer>
